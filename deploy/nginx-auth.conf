location = /assets/hero.jpg {
	if ($scheme = http) { return 301 https://$host$request_uri; }
	proxy_pass http://trouwen-80/assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0007.jpg;
}

location ^~ /assets/fotos_moments/ {
	if ($scheme = http) { return 301 https://$host$request_uri; }
	auth_basic "Prive - Mathijs en Chantal";
	auth_basic_user_file /etc/nginx/auth/trouwen.htpasswd;
	add_header Cache-Control "private, no-store" always;
	proxy_pass http://trouwen-80;
}