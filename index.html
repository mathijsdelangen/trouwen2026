<!doctype html>
<html lang="nl" data-theme="zand-terracotta" data-layout="raster">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Een verzameling herinneringen aan de trouwdag van Mathijs en Chantal."
    />
    <meta name="theme-color" content="#f3f2ec" />
    <title>Mathijs &amp; Chantal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero" id="boven">
      <nav class="topbar container" aria-label="Hoofdnavigatie">
        <a class="wordmark" href="#boven" aria-label="Mathijs en Chantal, naar boven">
          M <span>&amp;</span> C
        </a>
        <a class="topbar__link" href="#herinneringen">Foto's</a>
      </nav>

      <div class="hero__grid container">
        <div class="hero__content">
          <p class="eyebrow">18 september 2026 · Kasteel Tongelaar</p>
          <h1>Mathijs <span>&amp;</span><br />Chantal</h1>
          <section class="anniversary" aria-label="Hoelang we getrouwd zijn">
            <p class="anniversary__label">
              Getrouwd sinds <time datetime="2026-09-18T14:00:00+02:00">18 september 2026</time>
            </p>
            <dl class="anniversary__duration">
              <div class="anniversary__unit" id="year-unit" hidden>
                <dt>jaar</dt>
                <dd id="elapsed-years">0</dd>
              </div>
              <div class="anniversary__unit">
                <dt id="days-label">dagen</dt>
                <dd id="elapsed-days">0</dd>
              </div>
              <div class="anniversary__unit">
                <dt>uur</dt>
                <dd id="elapsed-hours">0</dd>
              </div>
              <div class="anniversary__unit">
                <dt id="minutes-label">minuten</dt>
                <dd id="elapsed-minutes">0</dd>
              </div>
            </dl>
          </section>
        </div>

        <figure class="hero__photo">
          <img
            src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0007.jpg"
            alt="Mathijs en Chantal lopen lachend hand in hand na de ceremonie"
            width="7411"
            height="4941"
            fetchpriority="high"
          />
        </figure>
      </div>
    </header>

    <main>
      <section class="section gallery-section" id="herinneringen">
        <div class="container">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Een dag om in te lijsten</p>
              <h2>Foto's</h2>
            </div>
            <p class="photographer-credit">
              Foto's door
              <a href="https://www.momentstofocuson.com/" target="_blank" rel="noopener noreferrer">MOMENTS To Focus On</a>
            </p>
          </div>

          <div class="gallery" aria-label="Foto's van onze trouwdag">
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0001.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0001.jpg" width="7952" height="5304" alt="Chantal wordt klaargemaakt voor de trouwdag" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0022.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0022.jpg" width="1669" height="2504" alt="Mathijs maakt zich klaar voor de ceremonie" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0002.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0002.jpg" width="8861" height="5907" alt="Chantal kijkt in de spiegel bij het raam" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0003.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0003.jpg" width="7675" height="5117" alt="Een emotioneel moment met familie voor de ceremonie" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0004.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0004.jpg" width="8932" height="5955" alt="Mathijs wacht Chantal op bij de kasteelpoort" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0005.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0005.jpg" width="3111" height="4664" alt="Portret van Chantal in haar trouwjurk" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0006.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0006.jpg" width="4873" height="7306" alt="Chantal in de boog van Kasteel Tongelaar" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0007.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0007.jpg" width="7411" height="4941" alt="Mathijs en Chantal lopen lachend hand in hand" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0008.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0008.jpg" width="9504" height="6336" alt="Mathijs en Chantal bij Kasteel Tongelaar" loading="lazy" decoding="async" /></a></figure>

            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0010.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0010.jpg" width="5219" height="7828" alt="Mathijs en Chantal zitten samen op een bankje in de tuin" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0011.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0011.jpg" width="7454" height="4969" alt="Het bruidspaar geniet samen in de kasteeltuin" loading="lazy" decoding="async" /></a></figure>

            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0015.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0015.jpg" width="7444" height="4965" alt="Groepsfoto met familie en vrienden" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0016.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0016.jpg" width="3203" height="2136" alt="Mathijs en Chantal met hun familie" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0017.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0017.jpg" width="4866" height="3244" alt="Het bruidspaar met een groep vrienden" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0018.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0018.jpg" width="6353" height="4237" alt="Familie en vrienden vieren samen met het bruidspaar" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0020.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0020.jpg" width="5511" height="3676" alt="Mathijs en Chantal tijdens het diner" loading="lazy" decoding="async" /></a></figure>
            <figure class="gallery__item"><a class="gallery__link" href="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0021.jpg" aria-haspopup="dialog"><img src="assets/fotos_moments/MOMENTSToFocusOn-PREVIEW0021.jpg" width="2501" height="1667" alt="Chantal wordt opgetild tijdens het feest" loading="lazy" decoding="async" /></a></figure>
          </div>
        </div>
      </section>

      <dialog class="photo-viewer" id="photo-viewer" aria-label="Foto op volledige grootte">
        <button class="photo-viewer__close" id="photo-viewer-close" type="button">Sluiten</button>
        <div class="photo-viewer__stage">
          <button class="photo-viewer__nav photo-viewer__nav--previous" id="photo-viewer-previous" type="button" aria-label="Vorige foto" aria-controls="photo-viewer-image">&larr;</button>
          <img class="photo-viewer__image" id="photo-viewer-image" alt="" />
          <button class="photo-viewer__nav photo-viewer__nav--next" id="photo-viewer-next" type="button" aria-label="Volgende foto" aria-controls="photo-viewer-image">&rarr;</button>
        </div>
      </dialog>

      <section class="section film-section" id="trouwfilm">
        <div class="container">
          <div class="section-heading section-heading--center">
            <div>
              <h2>Een verrassing</h2>
            </div>
          </div>
          <div class="film-placeholder" role="img" aria-label="Coming soon: een verrassing">
            <span class="film-placeholder__play" aria-hidden="true"></span>
            <p>Coming soon</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <a class="wordmark" href="#boven">M <span>&amp;</span> C</a>
        <p>Mathijs &amp; Chantal · 18 september 2026</p>
        <a href="#boven">Naar boven ↑</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
